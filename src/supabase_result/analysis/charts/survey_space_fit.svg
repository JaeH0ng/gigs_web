    <circle cx="190" cy="190" r="118" fill="#2f6f73" />
    <circle cx="190" cy="190" r="55" fill="#fbfaf7" />
    <text x="190" y="186" text-anchor="middle" class="title">5</text>
    <text x="190" y="211" text-anchor="middle" class="value">응답</text>
    
      <rect x="380" y="113" width="14" height="14" rx="2" fill="#2f6f73" />
      <text x="404" y="126" class="label">5점</text>
      <text x="732" y="126" text-anchor="end" class="value">5명 (100%)</text>
  
</svg>

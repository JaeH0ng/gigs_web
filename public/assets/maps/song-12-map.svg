<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <defs>
    <linearGradient id="wood" x1="0" y1="140" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F633C"/>
      <stop offset="1" stop-color="#5A3824"/>
    </linearGradient>
    <linearGradient id="stage" x1="92" y1="84" x2="708" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27313A"/>
      <stop offset="1" stop-color="#151A20"/>
    </linearGradient>
    <linearGradient id="fabric" x1="86" y1="54" x2="714" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F1DF" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#DDEAFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FFF4D2" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="beamGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 118) rotate(90) scale(190 350)">
      <stop stop-color="#8FD6FF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#8FD6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #F7EFE3; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #D8D0C4; }
      .tiny { font-family: Arial, sans-serif; font-size: 11px; fill: #EFE6D8; }
      .zone { stroke: #FFD95A; stroke-width: 3; stroke-dasharray: 8 9; filter: url(#softGlow); }
      .candidate { fill: #FFD95A; }
    </style>
  </defs>

